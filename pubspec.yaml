name: cantonese_dictionary_app
description: >
  A fully-local, offline Cantonese character dictionary app. No servers,
  no cloud accounts, no internet access required at any point.
publish_to: 'none'
# Version: MAJOR.MINOR.PATCH only (no "+N"). See "Versioning & releasing"
# in docs/setup_manual.md (Phase 6). Android's internal build number is
# calculated from this automatically in android/app/build.gradle.kts.
version: 1.2.0

environment:
  sdk: '>=3.0.0 <4.0.0'

# Dependencies, kept deliberately small:
#   - path_provider: locates the per-platform app folders (database file,
#     temp files).
#   - drift + drift_flutter: SQLite database (see lib/data/app_database.dart
#     and docs/decisions_log_sqlite_drift.md). drift_flutter bundles SQLite
#     itself into the app, so nothing needs installing on the phone.
#   - archive: builds/reads the backup .zip file.
#   - file_picker: the system "Save as" / "Open" window for backups (and
#     choosing a photo file on the laptop).
#   - image_picker: take a photo or pick one from the phone's gallery.
# State management is still a plain ChangeNotifier (no package).
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  archive: ^4.0.0
  file_picker: ^10.0.0
  image_picker: ^1.1.0

# Dev-only tools (never shipped in the app):
#   - drift_dev + build_runner: generate lib/data/app_database.g.dart from
#     the table definitions. Run after changing any table:
#       dart run build_runner build
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
